pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }

  plugins {
    id 'org.podval.tools.scala' version '2.2.0'
  }

  // String path: a File would call Settings.includeBuild (not a plugin build).
  final String conventionsDir =
    providers.gradleProperty('podvalGradleDir').getOrElse('../../Podval/podval-gradle')
  if (file(conventionsDir).isDirectory() && file("${conventionsDir}/settings.gradle").isFile()) {
    includeBuild conventionsDir
  }
  // Composite: plugin id. Library substitution is the settings-body includeBuild below.
  // Override with -PsitePublisherDir=. Missing directory (CI): resolve both from Maven Central.
  final String publisherPluginDir =
    providers.gradleProperty('sitePublisherDir').getOrElse('../../Podval/site-publisher')
  if (file(publisherPluginDir).isDirectory() && file("${publisherPluginDir}/settings.gradle").isFile()) {
    includeBuild publisherPluginDir
  }
}

plugins {
  id 'org.podval.conventions.settings' version '0.2.0'
}

rootProject.name = 'opentorah'

include ':core'
project(':core').name = 'opentorah-core'

include ':texts'
project(':texts').name = 'opentorah-texts'

include ':docs'

// Composite: substitute org.podval:org.podval.xml from a local xml checkout.
// Override with -PxmlDir=/path/to/xml. If the directory is missing, Gradle
// resolves the artifact from Maven Central. GitHub CI does not check out xml.
final File xmlDir = file(
  providers.gradleProperty('xmlDir').getOrElse('../../Podval/xml')
)
if (xmlDir.isDirectory() && new File(xmlDir, 'settings.gradle').isFile()) {
  includeBuild(xmlDir)
}

// Composite: substitute org.podval.tools:org.podval.tools.publisher (library child).
// Same directory as pluginManagement includeBuild; required now that the library is not the root.
final File publisherDir = file(
  providers.gradleProperty('sitePublisherDir').getOrElse('../../Podval/site-publisher')
)
if (publisherDir.isDirectory() && new File(publisherDir, 'settings.gradle').isFile()) {
  includeBuild(publisherDir)
}
