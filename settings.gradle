pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }

  plugins {
    id 'io.github.ben-manes.versions' version '0.61.0'
    id 'org.podval.tools.scalajs'      version '1.0.4'
    id 'com.google.cloud.tools.jib'    version '3.5.4'
    id 'org.podval.tools.cloudrun'     version '0.4.3'
    id 'com.gradle.plugin-publish'     version '1.2.1'
  }
}

dependencyResolutionManagement {
  repositories {
    mavenCentral()
  }
}

rootProject.name = 'opentorah'

include ':core'
project(':core').name = 'opentorah-core'

include ':texts'
project(':texts').name = 'opentorah-texts'

include ':docs'

// Composite: substitute org.podval:org.podval.xml from a local xml checkout.
// Override with -PxmlDir=/path/to/xml. If the directory is missing, Gradle
// resolves the artifact from Maven Central. GitHub CI does not check out xml.
final File xmlDir = file(
  providers.gradleProperty('xmlDir').getOrElse('../../Podval/xml')
)
if (xmlDir.isDirectory() && new File(xmlDir, 'settings.gradle').isFile()) {
  includeBuild(xmlDir)
}
