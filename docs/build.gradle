plugins {
  id 'scala'
  id 'org.podval.tools.site-publisher' version '0.2.0'
}

description = 'OpenTorah Documentation'

apply from: '../configure.gradle'

dependencies {
  implementation project(':opentorah-core')
}

site {
  treatErrorsAsWarnings = true
}

// JDK 22+ compatibility flags for generateTables (not site-publisher):
// scala.runtime.LazyVals$ (old lazy-val bytecode on the classpath) uses sun.misc.Unsafe
ext.jdkCompatJvmArgs = [
  '--enable-native-access=ALL-UNNAMED',
  '--sun-misc-unsafe-memory-access=allow',
]

final File buildDirectory = layout.buildDirectory.asFile.get()
final File tablesDir = file("$buildDirectory/tables")
tasks.register('generateTables', JavaExec) {
  group = 'documentation'
  outputs.dir(tablesDir)
  mainClass.set('org.opentorah.calendar.paper.Tables')
  args = [tablesDir]
  classpath = sourceSets.main.runtimeClasspath
  jvmArgs jdkCompatJvmArgs
}

tasks.named('generateSite') { dependsOn generateTables }
tasks.named('serveSite') { dependsOn generateTables }

tasks.named('build') {
  dependsOn(generateTables)
}
