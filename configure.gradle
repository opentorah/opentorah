pluginManager.apply 'org.podval.conventions'

// given `with` syntax is not ready
podval.scalaCompilerParameters.remove('-source:future')

// Published artifactIds stay opentorah-core and opentorah-texts.
if (pluginManager.hasPlugin('org.podval.tools.scalajs')) {
  scalaBackend {
    useArtifactSuffix = false
  }
}

final String catsVersion = '2.13.0'

dependencies {
  testImplementation 'org.scalatest:scalatest_3:3.2.20'
  testImplementation 'org.scalacheck:scalacheck_3:1.20.0'
  testImplementation 'org.typelevel:discipline-scalatest_3:2.3.0'
  testImplementation "org.typelevel:algebra-laws_3:$catsVersion"
}

if (pluginManager.hasPlugin('org.podval.conventions.publish')) {
  podvalPublish {
    gitHubRepository = 'opentorah/opentorah'
    inceptionYear = '2009'
    orgName = 'Open Torah Project'
    orgUrl = 'https://www.opentorah.org'
    developerEmail = 'dub@opentorah.org'
  }
}
