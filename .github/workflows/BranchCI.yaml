name: "Branch CI"
on:
  push:
    branches:
      - '*'
      - '!master'

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: "Build and test"
        run: ./gradlew --no-daemon build
